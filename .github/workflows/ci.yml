name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Syntax check backend and desktop shell
        shell: bash
        run: |
          for f in server/index.js server/routes/*.js server/services/*.js electron/*.cjs; do
            node --check "$f"
          done

  python-safety:
    name: Python safety-gate tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      # These modules have no GUI dependencies, so they run on a headless runner
      - name: Safety gate and loop guard tests
        working-directory: RuXt-AI-Vision-Desktop
        run: python -m pytest tests/test_safety.py tests/test_loop_guard.py tests/test_monitors.py -q
