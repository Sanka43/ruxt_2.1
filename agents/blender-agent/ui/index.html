<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blender 3D Master - Viewport Control</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fb923c;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .tool-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .tool-item {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin: 0;">Blender 3D Master</h2>
    <span class="badge">⚡ MCP Protocol Active</span>
  </div>
  <div class="card">
    <h4 style="margin: 0 0 8px 0; color: #94a3b8;">Active MCP Tools</h4>
    <div class="tool-list">
      <div class="tool-item">🛠️ create_mesh</div>
      <div class="tool-item">🎨 set_material</div>
      <div class="tool-item">💡 setup_lighting</div>
      <div class="tool-item">📷 setup_camera</div>
      <div class="tool-item">🔍 get_scene_objects</div>
      <div class="tool-item">🖼️ render_scene</div>
    </div>
  </div>
</body>
</html>
