<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineCut Studio - CapCut Pro Control Center</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --card-border: #1e293b;
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.25);
      --accent: #4facfe;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .badge {
      background: var(--primary-glow);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--primary);
    }
    h1 { font-size: 20px; font-weight: 700; }
    p.subtitle { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card h2 { font-size: 15px; font-weight: 600; color: var(--accent); }

    label { font-size: 13px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; }
    input[type="text"], select, textarea {
      width: 100%;
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #040914;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .progress-box {
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px;
      display: none;
    }
    .progress-bar-container {
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.3s ease;
    }
    .log-text { font-size: 12px; font-family: monospace; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-size: 28px;">🎬</div>
    <div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <h1>CineCut Studio</h1>
        <span class="badge">CapCut Pro</span>
      </div>
      <p class="subtitle">Zero-Mouse Autonomous Draft Synthesizer for CapCut Desktop</p>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>1. Project Configuration</h2>
      <div>
        <label>Project Title</label>
        <input type="text" id="projectTitle" value="Viral TikTok Edit" placeholder="My Video Project">
      </div>
      <div>
        <label>Aspect Ratio</label>
        <select id="aspectRatio">
          <option value="9:16">9:16 - TikTok / Instagram Reels / YouTube Shorts</option>
          <option value="16:9">16:9 - YouTube Landscape / Standard HD</option>
          <option value="1:1">1:1 - Instagram Feed Square</option>
          <option value="4:5">4:5 - Social Portrait</option>
        </select>
      </div>
      <div>
        <label>Background Audio / Voiceover Path (Optional)</label>
        <input type="text" id="audioPath" placeholder="C:/audio/bg_music.mp3">
      </div>
    </div>

    <div class="card">
      <h2>2. Media & Captions</h2>
      <div>
        <label>Video Clip Paths (Comma Separated)</label>
        <textarea id="videoPaths" rows="3" placeholder="C:/videos/clip1.mp4, C:/videos/clip2.mp4"></textarea>
      </div>
      <div>
        <label>Subtitles / Auto-Captions (Comma Separated)</label>
        <textarea id="subtitles" rows="3" placeholder="Hook line here, Second insight, Call to action"></textarea>
      </div>
    </div>
  </div>

  <button class="btn" id="launchBtn" onclick="startSynthesis()">
    ⚡ Synthesize Draft & Open CapCut Desktop
  </button>

  <div class="progress-box" id="progressBox">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600;">
      <span id="statusLabel">Building Project...</span>
      <span id="percentLabel">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="log-text" id="logOutput">⚡ Initializing Zero-Mouse Draft Synthesizer...</div>
  </div>

  <script>
    function startSynthesis() {
      const box = document.getElementById('progressBox');
      const bar = document.getElementById('progressBar');
      const label = document.getElementById('statusLabel');
      const pct = document.getElementById('percentLabel');
      const log = document.getElementById('logOutput');
      
      box.style.display = 'block';
      
      const steps = [
        { p: 20, l: 'Analyzing video streams & metadata (ffprobe)...' },
        { p: 45, l: 'Constructing multi-track timeline segments...' },
        { p: 70, l: 'Synthesizing styled auto-captions and audio mix...' },
        { p: 90, l: 'Writing native draft_content.json & registering in CapCut root...' },
        { p: 100, l: '✨ Done! Launching CapCut Desktop window to foreground...' }
      ];

      let i = 0;
      function next() {
        if (i < steps.length) {
          bar.style.width = steps[i].p + '%';
          pct.innerText = steps[i].p + '%';
          log.innerText = '⚡ ' + steps[i].l;
          i++;
          setTimeout(next, 700);
        } else {
          label.innerText = 'Project Ready in CapCut!';
          label.style.color = '#10b981';
        }
      }
      next();
    }
  </script>

</body>
</html>
