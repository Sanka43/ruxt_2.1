<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elena Voss · Chess lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./chess.css" />
</head>
<body>
  <div class="classroom">
    <header class="topbar">
      <div class="person">
        <img class="avatar" src="../avatar.jpg" alt="Elena Voss" />
        <div>
          <strong>Elena Voss</strong>
          <span id="presence">Active now · Chess lesson</span>
        </div>
      </div>
      <span class="tag" id="turnBadge">White to move</span>
    </header>

    <main class="layout">
      <section class="board-panel">
        <div class="board-frame">
          <div class="coord-files top" id="topFiles"></div>
          <div class="board-mid">
            <div class="coord-ranks" id="leftRanks"></div>
            <div id="board" class="board" aria-label="Chess board"></div>
          </div>
          <div class="coord-files bottom" id="bottomFiles"></div>
        </div>
        <div class="actions">
          <button type="button" id="newGameBtn">New game</button>
          <button type="button" id="hintBtn" class="soft">Ask Elena for a hint</button>
        </div>
        <ol class="moves" id="moveList"></ol>
      </section>

      <aside class="chat-panel">
        <section class="thread" id="thread" aria-live="polite"></section>
        <div class="typing" id="typing" hidden>
          <img src="../avatar.jpg" alt="" />
          <span><i></i><i></i><i></i></span>
        </div>
        <p class="coach-fallback" id="coachText" hidden></p>
        <div class="chips">
          <button type="button" id="hintChip">What should I look at?</button>
          <button type="button" id="resetChip">Let’s start fresh</button>
        </div>
      </aside>
    </main>
  </div>
  <script src="./chess.js"></script>
</body>
</html>
